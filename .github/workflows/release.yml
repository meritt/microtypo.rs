name: Release

on:
  push:
    tags:
      - v*

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: Identity
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
    env:
      REF: ${{ github.ref_name }}
      EVENT_COMMIT: ${{ github.sha }}
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identity
        id: identity
        run: |
          if [[ ! "$REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release ref is not a canonical vMAJOR.MINOR.PATCH"
            exit 1
          fi
          source_commit="$(git rev-parse "refs/tags/$REF^{commit}")"
          main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          if [ "$source_commit" != "$(git rev-parse 'HEAD^{commit}')" ] ||
             [ "$source_commit" != "$(git rev-parse "$EVENT_COMMIT^{commit}")" ] ||
             [ "$source_commit" != "$WORKFLOW_COMMIT" ] ||
             ! git merge-base --is-ancestor "$source_commit" "$main_commit"; then
            echo "::error::tag, source, workflow, or protected main identity differs"
            exit 1
          fi
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          packaged="$(jq -r .version packages/npm/package.json)"
          if [ "v$declared" != "$REF" ] || [ "$packaged" != "$declared" ]; then
            echo "::error::release ref, workspace version and npm package version differ"
            exit 1
          fi
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

  gates:
    name: Gates
    needs: identity
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_COMMIT&event=push&branch=main&status=success&exclude_pull_requests=true" \
            --jq '[.workflow_runs[] | select(.head_sha == env.SOURCE_COMMIT and .path == ".github/workflows/ci.yml" and .head_repository.full_name == env.REPOSITORY)] | length')"
          if [ "$runs" -eq 0 ]; then
            echo "::error::CI has not succeeded on main for the release commit"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        run: rustup toolchain install

      - name: Install
        env:
          CARGO_DENY_SHA256: 98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786
          SEMVER_CHECKS_SHA256: 396c8508d973c83de52660943a057e971b586f7511c3ba695762373452b43d5b
        run: |
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$2" "$1"
          }
          mkdir -p "$RUNNER_TEMP/bin"
          deny="$RUNNER_TEMP/cargo-deny.tar.gz"
          fetch https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.0/cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz "$deny"
          echo "$CARGO_DENY_SHA256  $deny" | sha256sum -c - > /dev/null
          tar -xzf "$deny" -C "$RUNNER_TEMP/bin" --strip-components 1 cargo-deny-0.22.0-x86_64-unknown-linux-musl/cargo-deny
          semver="$RUNNER_TEMP/cargo-semver-checks.tar.gz"
          fetch https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.51.0/cargo-semver-checks-x86_64-unknown-linux-musl.tar.gz "$semver"
          echo "$SEMVER_CHECKS_SHA256  $semver" | sha256sum -c - > /dev/null
          tar -xzf "$semver" -C "$RUNNER_TEMP/bin" cargo-semver-checks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Audit
        run: cargo deny --locked check advisories

      - name: Semver
        run: |
          baseline="$(git tag --list 'v*' --no-contains HEAD --sort=-version:refname | head -n 1)"
          if [ -z "$baseline" ]; then
            echo "no release to compare with"
            exit 0
          fi
          cargo semver-checks -p microtypo-core --baseline-rev "$baseline"

  build:
    name: Build
    needs: identity
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sums_sha256: ${{ steps.package.outputs.sums_sha256 }}
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        run: rustup toolchain install

      - name: Setup
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          working-directory: packages/npm
          install: false

      - name: Install
        env:
          BINARYEN_SHA256: ad66da82ac13f163e424b1643f16c6dfcccc98b5966296b43e52d3cab04f84a8
          WASM_BINDGEN_SHA256: b90ddb9357f584b1af897d58ad77e4cce2b48fc17e2a967bc249a87f72809444
        run: |
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$2" "$1"
          }
          mkdir -p "$RUNNER_TEMP/bin"
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          fetch https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-arm64-macos.tar.gz "$archive"
          echo "$BINARYEN_SHA256  $archive" | shasum -a 256 -c - > /dev/null
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
          version="$(cargo pkgid --locked -p wasm-bindgen)"
          version="${version##*@}"
          bindgen="wasm-bindgen-$version-aarch64-apple-darwin"
          archive="$RUNNER_TEMP/wasm-bindgen.tar.gz"
          fetch "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$bindgen.tar.gz" "$archive"
          echo "$WASM_BINDGEN_SHA256  $archive" | shasum -a 256 -c - > /dev/null
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" --strip-components 1 "$bindgen/wasm-bindgen"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Package
        id: package
        run: |
          cargo xtask dist "$RUNNER_TEMP/release"
          cargo xtask pin --check "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          if ! jq -e --arg commit "$SOURCE_COMMIT" '.commit == $commit and .dirty == false' release-manifest.json > /dev/null; then
            echo "::error::release manifest does not describe a clean build of the release commit"
            exit 1
          fi
          printf 'sums_sha256=%s\nmanifest_sha256=%s\n' \
            "$(shasum -a 256 SHA256SUMS | cut -d ' ' -f 1)" \
            "$(shasum -a 256 release-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  provenance:
    name: Provenance
    needs:
      - gates
      - build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      attestations: write
      id-token: write
    env:
      SUMS_SHA256: ${{ needs.build.outputs.sums_sha256 }}
      MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: release-input

      - name: Verify
        working-directory: release-input
        run: |
          if [ "$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" != "$SUMS_SHA256" ] ||
             [ "$(sha256sum release-manifest.json | cut -d ' ' -f 1)" != "$MANIFEST_SHA256" ]; then
            echo "::error::signing input is not the exact built set"
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS

      - name: Sign
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-input/*

  publish:
    name: Publish
    needs:
      - identity
      - gates
      - build
      - provenance
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      REF: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
      SUMS_SHA256: ${{ needs.build.outputs.sums_sha256 }}
      MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: release-input

      - name: Verify
        working-directory: release-input
        run: |
          if [ "$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" != "$SUMS_SHA256" ] ||
             [ "$(sha256sum release-manifest.json | cut -d ' ' -f 1)" != "$MANIFEST_SHA256" ]; then
            echo "::error::publication input is not the exact built set"
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS
          shopt -s dotglob nullglob
          entries=(*)
          if [ "${#entries[@]}" -ne "$(( $(wc -l < SHA256SUMS) + 2 ))" ]; then
            echo "::error::publication input holds files other than the built set"
            exit 1
          fi

      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$REF" --repo "$REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create "$REF" --repo "$REPOSITORY" --verify-tag \
            --target "$SOURCE_COMMIT" --draft --title "$REF" --notes ""

      - name: Readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(cut -d ' ' -f 3 release-input/SHA256SUMS)
          assets+=(SHA256SUMS release-manifest.json)
          (cd release-input && gh release upload "$REF" --repo "$REPOSITORY" "${assets[@]}")
          mkdir -p readback
          for asset in "${assets[@]}"; do
            gh release download "$REF" --repo "$REPOSITORY" --dir readback --pattern "$asset"
            cmp "release-input/$asset" "readback/$asset"
          done
          if [ "$(gh release view "$REF" --repo "$REPOSITORY" --json assets --jq '.assets | length')" -ne "${#assets[@]}" ]; then
            echo "::error::release holds assets other than the built set"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$REF" --repo "$REPOSITORY" --draft=false --latest

  immutability:
    name: Immutability
    needs:
      - identity
      - build
      - publish
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    env:
      REF: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
      SUMS_SHA256: ${{ needs.build.outputs.sums_sha256 }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$REF" --repo "$REPOSITORY" --dir "$RUNNER_TEMP/release"

      - name: Verify
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" != "$SUMS_SHA256" ]; then
            echo "::error::published release identity differs"
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS
          for attempt in {1..30}; do
            if gh release verify "$REF" --repo "$REPOSITORY"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::release attestation for $REF was not available after 30 attempts"
              exit 1
            fi
            sleep 2
          done
          for asset in *; do
            gh release verify-asset "$REF" "$asset" --repo "$REPOSITORY"
            gh attestation verify "$asset" --repo "$REPOSITORY" --deny-self-hosted-runners \
              --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$REF" --source-digest "$SOURCE_COMMIT"
          done

  ship:
    name: Ship
    needs:
      - identity
      - immutability
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
      packages: write
    env:
      REF: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
      REPOSITORY: ${{ github.repository }}
      PACKAGE: "@meritt/microtypo-wasm"
      REGISTRY: https://npm.pkg.github.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/npm

      - name: Setup
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          working-directory: packages/npm
          install: false

      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$REF" --repo "$REPOSITORY" --dir "$RUNNER_TEMP/release" --pattern "microtypo-$REF-npm.tgz"

      - name: Verify
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "microtypo-$REF-npm.tgz" --repo "$REPOSITORY" --deny-self-hosted-runners \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$REF" --source-digest "$SOURCE_COMMIT"
          manifest="$(tar -xOzf "microtypo-$REF-npm.tgz" package/package.json)"
          if [ "$(jq -r .name <<< "$manifest")" != "$PACKAGE" ] || [ "$(jq -r .version <<< "$manifest")" != "${REF#v}" ]; then
            echo "::error::released tarball is not $PACKAGE ${REF#v}"
            exit 1
          fi

      - name: Submit
        working-directory: packages/npm
        env:
          GH_TOKEN: ${{ github.token }}
          PNPM_CONFIG__AUTH: |
            {
              "https://npm.pkg.github.com": {
                "@meritt": {
                  "authToken": ${{ toJSON(github.token) }}
                }
              }
            }
        run: |
          tarball="$RUNNER_TEMP/release/microtypo-$REF-npm.tgz"
          stored="$RUNNER_TEMP/readback.tgz"
          readback() {
            local status url
            status="$(curl --silent --show-error --location --proto '=https' --tlsv1.2 \
              --header "Authorization: Bearer $GH_TOKEN" --output "$RUNNER_TEMP/packument.json" \
              --write-out '%{http_code}' "$REGISTRY/${PACKAGE/\//%2f}")"
            case "$status" in
              200) ;;
              404) return 0 ;;
              *)
                echo "::error::GitHub Packages answered $status for $PACKAGE"
                return 1
                ;;
            esac
            url="$(jq -r --arg version "${REF#v}" '.versions[$version].dist.tarball // empty' "$RUNNER_TEMP/packument.json")"
            if [ -n "$url" ]; then
              curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
                --header "Authorization: Bearer $GH_TOKEN" --output "$stored" "$url"
            fi
          }
          readback
          if [ ! -f "$stored" ]; then
            pnpm publish "$tarball" --registry "$REGISTRY" --no-git-checks
            for _ in {1..30}; do
              readback
              if [ -f "$stored" ]; then
                break
              fi
              sleep 2
            done
          fi
          if ! cmp -s "$tarball" "$stored"; then
            echo "::error::$PACKAGE ${REF#v} in GitHub Packages is not the released tarball"
            exit 1
          fi
