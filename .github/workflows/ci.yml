name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: ci-test-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Setup
        run: |
          rustup toolchain install
          declared="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          if [[ "$(rustc --version)" != "rustc $declared "* ]]; then
            echo "::error::effective Rust version does not match rust-toolchain.toml"
            exit 1
          fi

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        env:
          CARGO_BUILD_WARNINGS: deny
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --workspace --all-targets --all-features --locked
          cargo clippy -p microtypo-core -p microtypo-wasm --locked --target wasm32-unknown-unknown
          cargo doc --workspace --no-deps --locked

      - name: Policy
        run: |
          cargo xtask header --check
          cargo xtask corpus --check
          cargo xtask matchers --check

      - name: Install
        env:
          CARGO_DENY_SHA256: 98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$2" "$1"
          }
          mkdir -p "$RUNNER_TEMP/bin"
          deny="$RUNNER_TEMP/cargo-deny.tar.gz"
          fetch https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.0/cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz "$deny"
          echo "$CARGO_DENY_SHA256  $deny" | sha256sum -c - > /dev/null
          tar -xzf "$deny" -C "$RUNNER_TEMP/bin" --strip-components 1 cargo-deny-0.22.0-x86_64-unknown-linux-musl/cargo-deny
          leaks="$RUNNER_TEMP/gitleaks.tar.gz"
          fetch https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz "$leaks"
          echo "$GITLEAKS_SHA256  $leaks" | sha256sum -c - > /dev/null
          tar -xzf "$leaks" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Audit
        run: cargo deny --locked check

      - name: Secrets
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          gitleaks dir --redact --no-banner --timeout 300 \
            --max-target-megabytes 64 "$RUNNER_TEMP/source"

      - name: Test
        run: cargo test --workspace --locked

      - name: Save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.restore.outputs.cache-primary-key }}

  soundness:
    name: Soundness
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: ci-soundness-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      MIRI_TOOLCHAIN: nightly-2026-11-20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/miri/
            target/
          key: soundness-${{ runner.os }}-${{ runner.arch }}-${{ env.MIRI_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: soundness-${{ runner.os }}-${{ runner.arch }}-${{ env.MIRI_TOOLCHAIN }}-

      - name: Setup
        run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src

      - name: Soundness
        run: cargo "+$MIRI_TOOLCHAIN" miri test -p microtypo-ffi --no-default-features --lib --locked

      - name: Save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/miri/
            target/
          key: ${{ steps.restore.outputs.cache-primary-key }}

  build:
    name: Build
    runs-on: xcode-27
    timeout-minutes: 15
    concurrency:
      group: ci-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        run: rustup toolchain install

      - name: Setup
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          working-directory: packages/npm
          install: false

      - name: Install
        env:
          BINARYEN_SHA256: ad66da82ac13f163e424b1643f16c6dfcccc98b5966296b43e52d3cab04f84a8
          WASM_BINDGEN_SHA256: b90ddb9357f584b1af897d58ad77e4cce2b48fc17e2a967bc249a87f72809444
        run: |
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$2" "$1"
          }
          mkdir -p "$RUNNER_TEMP/bin"
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          fetch https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-arm64-macos.tar.gz "$archive"
          echo "$BINARYEN_SHA256  $archive" | shasum -a 256 -c - > /dev/null
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
          version="$(cargo pkgid --locked -p wasm-bindgen)"
          version="${version##*@}"
          bindgen="wasm-bindgen-$version-aarch64-apple-darwin"
          archive="$RUNNER_TEMP/wasm-bindgen.tar.gz"
          fetch "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$bindgen.tar.gz" "$archive"
          echo "$WASM_BINDGEN_SHA256  $archive" | shasum -a 256 -c - > /dev/null
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" --strip-components 1 "$bindgen/wasm-bindgen"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Package
        run: cargo xtask dist "$RUNNER_TEMP/release"

      - name: Upload
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-set
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
